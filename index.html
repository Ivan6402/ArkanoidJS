<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkanoid</title>
</head>
<body>
    <style>
        body {
            background-color: #111;

        }

        canvas {
            border-bottom: transparent;
            /* background-image se repite horizontal y vertical por default */
            background-image: url('./img/bkg.png');
            margin: 0 auto;
            display: block;
        }
    </style>

    <canvas></canvas>

    <img hidden id="sprite" src="/img/sprite.png" alt="sprite arkanoid">
    <img hidden id="bricks" src="/img/bricks.png" alt="sprite bricks">


    <script>
        const canvas = document.querySelector('canvas');
        const ctx = canvas.getContext('2d'); // 2d rendering context

        const sprite = document.getElementById('sprite');
        const bricks = document.getElementById('bricks');

        canvas.width = 448;
        canvas.height = 400;

        // variables del juego

        // variables de la pelota
        const ballRadius = 4;

        // posición de la pelota
        let x = canvas.width / 2;
        let y = canvas.height - 30;
        // velocidad de la pelota
        let dx = 2;
        let dy = -2;

        // variables de la paleta
        const paddleHeight = 10;
        const paddleWidth = 50;

        let paddleX = (canvas.width - paddleWidth) / 2;
        let paddleY = canvas.height - paddleHeight - 10;

        let rightPressed = false;
        let leftPressed = false;

        const PADDLE_SENSITIVITY = 7;

        function drawBall() {
            ctx.beginPath()
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.closePath(); // mejora el rendimiento, evita trazados al final
        }

        function drawPaddle() {
            ctx.drawImage(
                sprite,
                29,
                174,
                paddleWidth,
                paddleHeight,
                paddleX,
                paddleY,
                paddleWidth,
                paddleHeight
            );
        }
        function drawBricks() {}

        function collisionDetection() {}

        function ballMovement() {
            // colisiones horizontales
            if (
                x + dx > canvas.width - ballRadius || // la pared derecha
                x + dx < ballRadius // pared izquierda
            ) {
                dx = -dx;
            }

            if ( y + dy < ballRadius ) { // toca el techo
                dy = -dy;
            }

            const isBallSameXAsPaddle = x > paddleX && x < paddleX + paddleWidth;

            const isBallTouchingPaddle = y + dy > paddleY;

            if (isBallSameXAsPaddle && isBallTouchingPaddle) { // si toca la paleta
                dy = -dy
            }

            if (y + dy > canvas.height - ballRadius) { // toca el suelo
                document.location.reload();
            }

            // mover la pelota
            x += dx;
            y += dy;
        }
        function paddleMovement() {
            if (rightPressed && paddleX < canvas.width - paddleWidth) {
                paddleX += PADDLE_SENSITIVITY;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= PADDLE_SENSITIVITY;
            }
        }

        function cleanCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function initEvents () {
            document.addEventListener('keydown', keyDownHandler);
            document.addEventListener('keyup', keyUpHandler);

            function keyDownHandler (event) {
                const { key } = event;
                if ( key === 'Right' || key === 'ArrowRight') {
                    rightPressed = true;
                } else if (key === 'Left' || key === 'ArrowLeft') {
                    leftPressed = true;
                }
            }

            function keyUpHandler(event) {
                const { key } = event;
                if (key === 'Right' || key === 'ArrowRight') {
                    rightPressed = false;
                } else if (key === 'Left' || key === 'ArrowLeft') {
                    leftPressed = false;
                }
            }
        }

        function draw() {
            cleanCanvas();
            // hay que dibujar elementos
            drawBall();
            drawPaddle();
            drawBricks();
            // drawScore();

            // colisiones y movimientos
            collisionDetection();
            ballMovement();
            paddleMovement();

            window.requestAnimationFrame(draw);
        }
        draw();
        initEvents();
    </script>
</body>
</html>
